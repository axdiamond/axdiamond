summary: |
  I build software for systems where failure has real consequences. Twelve years of production engineering — across autonomous industrial automation, real-time satellite network control, and one of the largest distributed storage platforms in the world — has taught me what it means to write code that actually has to work: in sand, in orbit, at scale.

  At Amazon Leo, I own the data systems architecture for our satellite SDN — building the real-time telemetry platform that closes the loop between network planning and live failure response. At Covia, I built the software behind the highest-throughput sand mine in Texas, working hands-on with industrial engineers in the field. I raise the engineering bar wherever I work — mentoring teams, setting performance standards, and making sure every technical decision connects to the outcome it enables. Described as a serial overachiever. I'll take it.

experiences:
