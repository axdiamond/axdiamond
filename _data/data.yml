    details: |
      Data systems technical lead for the T-SDN organization; the go-to for architecture decisions, performance standards, and data intensive system design across the team.

      - Took the SDN's control plane interface from prototype to production, working closely with the embedded team to develop the SDN's presence on our devices, delivering network intent and distributing it across the constellation.
      - Built the observability platform from the ground up, processing gigabytes of network telemetry per second, closing the feedback loop between planning and execution so the system can react to failures in real time and minimize downtime.
      - Dove deep into device internals to identify and prioritize the most impactful telemetry to surface, directly tied to real operational problems.
      - Built search experiences backed by OpenSearch, enabling fast searches lookup across satellite, ground station, and customer terminal contact data in under 150ms round trip, sustaining that latency under thousands of concurrent clients using our observability tools

